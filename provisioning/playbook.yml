---
- name: Common setup on every host
  hosts: all
  become: true
  roles:
    - hosts

- name: Configure the user machine
  hosts: user
  become: true
  roles:
    - user

- name: Configure the DNS server
  hosts: dns
  become: true
  roles:
    - dns

- name: Configure the attacker machine
  hosts: attacker
  become: true
  roles:
    - attacker
